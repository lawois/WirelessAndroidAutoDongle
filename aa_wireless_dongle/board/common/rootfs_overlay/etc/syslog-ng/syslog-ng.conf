@version: 3.38
@include "scl.conf"

# Options
options {
    chain_hostnames(off);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    owner(root);
    group(adm);
    perm(0640);
    stats_freq(0);
    frac_digits(3); # For sub-second precision if timestamps support it
    ts_format(iso); # ISO 8601 timestamp format
};

# Sources
source s_sys {
    system();  # Read from /dev/log, kernel messages from /proc/kmsg
    internal(); # Internal messages of syslog-ng
};

# Destinations
destination d_messages {
    file("/var/log/messages"
         perm(0640)
         # Basic rotation: 5 files, 1MB each. More advanced rotation via logrotate.
         log_fifo_size(256) # Buffer size for messages
         # For syslog-ng internal rotation (can be complemented by logrotate)
         # log_rotate_size(1024*1024); # 1 MB
         # log_rotate_date(daily);
         # log_keep_history(5);
    );
};

destination d_user {
    file("/var/log/user.log"
         perm(0640)
         log_fifo_size(256)
    );
};

# Filters
filter f_user { facility(user); };
filter f_not_user { not facility(user); };

# Log paths
log {
    source(s_sys);
    filter(f_user);
    destination(d_user);
};

log {
    source(s_sys);
    filter(f_not_user); # Log everything else to messages
    destination(d_messages);
};

# Include all config files in /etc/syslog-ng/conf.d/
@include "/etc/syslog-ng/conf.d/*.conf"
